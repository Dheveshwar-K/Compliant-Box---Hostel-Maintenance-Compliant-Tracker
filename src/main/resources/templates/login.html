<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ComplaintBox</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body class="login-page">

<div class="login-container">

    <div class="login-left">

        <div class="brand">
            <div class="brand-icon">CB</div>
            <span>ComplaintBox</span>
        </div>

        <div class="login-info">

            <div class="hero-badge">
                HOSTEL MANAGEMENT
            </div>

            <h1>
                Welcome back.
            </h1>

            <p>
                Manage hostel maintenance complaints,
                assignments and resolutions from one place.
            </p>

        </div>

    </div>

    <div class="login-card">

        <div class="login-header">

            <h2>Sign In</h2>

            <p>
                Enter your details to continue
            </p>

        </div>

        <form id="loginForm">

            <div class="form-group">

                <label>Email / User ID</label>

                <input
                    type="text"
                    id="loginUser"
                    placeholder="Enter your user ID"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <div class="form-group">

                <label>Role</label>

                <select id="loginRole">

                    <option value="resident">
                        Resident
                    </option>

                    <option value="staff">
                        Staff
                    </option>

                    <option value="warden">
                        Warden
                    </option>

                </select>

            </div>

            <button
                type="submit"
                class="btn btn-primary btn-full"
            >
                Sign In
            </button>

        </form>

        <div class="login-note">

            Demo login currently uses the selected role.
            Authentication can be connected later.

        </div>

        <a href="/" class="back-link">
            ← Back to Home
        </a>

    </div>

</div>

<script src="/js/app.js"></script>

</body>
</html>
