<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Staff | ComplaintBox</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="sidebar-brand">

            <div class="brand-icon">
                CB
            </div>

            <span>ComplaintBox</span>

        </div>

        <nav class="sidebar-nav">

            <a href="/dashboard" class="nav-item">
                <span>▦</span>
                Dashboard
            </a>

            <a href="/complaints" class="nav-item">
                <span>⚠</span>
                Complaints
            </a>

            <a href="/residents" class="nav-item">
                <span>♙</span>
                Residents
            </a>

            <a href="/staff" class="nav-item active">
                <span>⚙</span>
                Staff
            </a>

            <a href="/categories" class="nav-item">
                <span>▤</span>
                Categories
            </a>

        </nav>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>Staff</h1>

                <p>
                    Manage maintenance staff and wardens
                </p>

            </div>

            <button
                class="btn btn-primary"
                onclick="openStaffModal()"
            >
                + Add Staff
            </button>

        </header>

        <section class="panel">

            <div class="table-container">

                <table>

                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Status</th>
                    </tr>

                    </thead>

                    <tbody id="staffTable">

                    <tr>
                        <td colspan="4" class="empty-state">
                            Loading staff...
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<!-- STAFF MODAL -->

<div id="staffModal" class="modal">

    <div class="modal-card">

        <div class="modal-header">

            <div>

                <h2>Add Staff</h2>

                <p>
                    Register staff or warden
                </p>

            </div>

            <button
                class="modal-close"
                onclick="closeStaffModal()"
            >
                ×
            </button>

        </div>

        <form id="staffForm">

            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    id="staffName"
                    placeholder="Staff name"
                    required
                >

            </div>

            <div class="form-group">

                <label>Role</label>

                <select id="staffRole" required>

                    <option value="STAFF">
                        Staff
                    </option>

                    <option value="WARDEN">
                        Warden
                    </option>

                </select>

            </div>

            <div class="modal-actions">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="closeStaffModal()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Add Staff
                </button>

            </div>

        </form>

    </div>

</div>

<script src="/js/app.js"></script>

</body>
</html>
