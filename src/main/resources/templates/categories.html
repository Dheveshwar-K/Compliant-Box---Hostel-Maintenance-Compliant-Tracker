<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Categories | ComplaintBox</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="sidebar-brand">

            <div class="brand-icon">
                CB
            </div>

            <span>ComplaintBox</span>

        </div>

        <nav class="sidebar-nav">

            <a href="/dashboard" class="nav-item">
                <span>▦</span>
                Dashboard
            </a>

            <a href="/complaints" class="nav-item">
                <span>⚠</span>
                Complaints
            </a>

            <a href="/residents" class="nav-item">
                <span>♙</span>
                Residents
            </a>

            <a href="/staff" class="nav-item">
                <span>⚙</span>
                Staff
            </a>

            <a href="/categories" class="nav-item active">
                <span>▤</span>
                Categories
            </a>

        </nav>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>Categories</h1>

                <p>
                    Manage maintenance complaint categories
                </p>

            </div>

            <button
                class="btn btn-primary"
                onclick="openCategoryModal()"
            >
                + Add Category
            </button>

        </header>

        <section class="category-grid" id="categoryGrid">

            <div class="empty-state">
                Loading categories...
            </div>

        </section>

    </main>

</div>

<!-- CATEGORY MODAL -->

<div id="categoryModal" class="modal">

    <div class="modal-card">

        <div class="modal-header">

            <div>

                <h2>Add Category</h2>

                <p>
                    Create a complaint category
                </p>

            </div>

            <button
                class="modal-close"
                onclick="closeCategoryModal()"
            >
                ×
            </button>

        </div>

        <form id="categoryForm">

            <div class="form-group">

                <label>Category Name</label>

                <input
                    type="text"
                    id="categoryName"
                    placeholder="Example: Plumbing"
                    required
                >

            </div>

            <div class="form-group">

                <label>Description</label>

                <textarea
                    id="categoryDescription"
                    rows="4"
                    placeholder="Describe this category..."
                    required
                ></textarea>

            </div>

            <div class="modal-actions">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="closeCategoryModal()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Add Category
                </button>

            </div>

        </form>

    </div>

</div>

<script src="/js/app.js"></script>

</body>
</html>
